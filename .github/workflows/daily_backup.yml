name: Daily Supabase Excel Backup

on:
  schedule:
    # 12:30 AM IST = 19:00 UTC (test window - enough time for GitHub to register schedule)
    - cron: '0 19 * * *'
    # Failsafe slot 5 mins later
    - cron: '5 19 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas openpyxl resend

      - name: Run Supabase Backup & Send Email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python supabase_excel_backup.py
