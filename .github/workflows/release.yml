name: Automated Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            build_cmd: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            asset_name: ShopManagement-Android.apk

          - target: windows
            os: windows-latest
            build_cmd: flutter build windows --release
            artifact_path: build/windows/x64/runner/Release/
            asset_name: PerfectSolution-Setup.exe

          - target: macos
            os: macos-latest
            build_cmd: flutter build macos --release
            artifact_path: build/macos/Build/Products/Release/
            asset_name: ShopManagement-macOS.dmg

          - target: web
            os: ubuntu-latest
            build_cmd: flutter build web --release
            artifact_path: build/web
            asset_name: web-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: flutter config --enable-macos-desktop --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare macOS Native Configs
        if: matrix.target == 'macos'
        run: |
          cd macos
          pod install --repo-update
          cd ..

      - name: Build Target Artifact
        run: ${{ matrix.build_cmd }}

      - name: Package Windows Installer
        if: matrix.target == 'windows'
        run: |
          choco install innosetup --yes
          $issContent = @"
          [Setup]
          AppName=Perfect Solution
          AppVersion=1.0.0-beta
          DefaultDirName={autopf}\Perfect Solution
          DefaultGroupName=Perfect Solution
          UninstallDisplayIcon={app}\shop_management_flutter.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=PerfectSolution-Setup
          
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{autoprograms}\Perfect Solution"; Filename: "{app}\shop_management_flutter.exe"
          Name: "{autodesktop}\Perfect Solution"; Filename: "{app}\shop_management_flutter.exe"

          [Run]
          Filename: "{app}\shop_management_flutter.exe"; Description: "{cm:LaunchProgram,Perfect Solution}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $issContent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Package macOS DMG
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist_macos
          cp -R "build/macos/Build/Products/Release/Perfect Solution.app" dist_macos/ || cp -R build/macos/Build/Products/Release/*.app dist_macos/
          brew install create-dmg || true
          create-dmg \
            --volname "Perfect Solution" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Perfect Solution.app" 175 120 \
            --hide-extension "Perfect Solution.app" \
            --app-drop-link 425 120 \
            "PerfectSolution-macOS.dmg" \
            "dist_macos/" || hdiutil create -volname "Perfect Solution" -srcfolder "dist_macos/" -ov -format UDZO PerfectSolution-macOS.dmg

      - name: Upload Artifacts to GitHub Release
        if: matrix.target != 'web'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.target == 'android' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            ${{ matrix.target == 'windows' && 'PerfectSolution-Setup.exe' || '' }}
            ${{ matrix.target == 'macos' && 'PerfectSolution-macOS.dmg' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Web to GitHub Pages
        if: matrix.target == 'web'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
