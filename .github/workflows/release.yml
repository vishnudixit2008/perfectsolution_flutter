name: Automated Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            build_cmd: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            asset_name: ShopManagement-Android.apk

          - target: windows
            os: windows-latest
            build_cmd: flutter build windows --release
            artifact_path: build/windows/x64/runner/Release/
            asset_name: PerfectSolution-Setup.exe

          - target: macos
            os: macos-latest
            build_cmd: flutter build macos --release
            artifact_path: build/macos/Build/Products/Release/
            asset_name: ShopManagement-macOS.dmg

          - target: web
            os: ubuntu-latest
            build_cmd: flutter build web --release
            artifact_path: build/web
            asset_name: web-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: flutter config --enable-macos-desktop --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare macOS Native Configs
        if: matrix.target == 'macos'
        run: |
          cd macos
          pod install --repo-update
          cd ..

      - name: Build Target Artifact
        run: ${{ matrix.build_cmd }}

      - name: Verify and Fix Release Folder Contents
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $dataDir    = "$releaseDir\data"

          Write-Host "=== Release folder contents ==="
          Get-ChildItem -Recurse $releaseDir | Select-Object FullName | Format-Table -AutoSize

          # flutter_assets MUST be inside data\ for the app to find icons/logos/fonts
          # CMake install guard may have skipped it — copy it explicitly here
          $flutterAssetsSrc = "build\windows\x64\flutter_assets"
          $flutterAssetsDst = "$dataDir\flutter_assets"
          if ((Test-Path $flutterAssetsSrc) -and -not (Test-Path $flutterAssetsDst)) {
            New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
            Copy-Item -Recurse -Force $flutterAssetsSrc $flutterAssetsDst
            Write-Host "Copied flutter_assets -> $flutterAssetsDst"
          } elseif (Test-Path $flutterAssetsDst) {
            Write-Host "OK: flutter_assets already present at $flutterAssetsDst"
          } else {
            Write-Warning "flutter_assets not found at $flutterAssetsSrc — icons/logos may be missing"
          }

          # Also ensure app.so (AOT library) is in data\
          $aotSrc = "build\windows\x64\runner\Release\data\app.so"
          if (-not (Test-Path $aotSrc)) {
            $aotAlt = "build\windows\x64\app.so"
            if (Test-Path $aotAlt) {
              Copy-Item $aotAlt "$dataDir\app.so" -Force
              Write-Host "Copied app.so to data\"
            }
          }

      - name: Download VC++ Redistributable Installer
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          # Download official Microsoft VC++ 2015-2022 x64 Redistributable
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = "vc_redist.x64.exe"
          Write-Host "Downloading VC++ Redistributable from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          if (Test-Path $out) {
            Write-Host "Downloaded: $((Get-Item $out).Length) bytes"
          } else {
            throw "Failed to download VC++ Redistributable"
          }

      - name: Package Windows Installer
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

          # Write installer.iss line by line (heredoc breaks YAML indentation rules)
          $iss = "installer.iss"

          # [Setup]
          Set-Content  -Path $iss -Encoding UTF8 -Value "[Setup]"
          Add-Content  -Path $iss -Value "AppName=Perfect Solution"
          Add-Content  -Path $iss -Value "AppVersion=1.0.7"
          Add-Content  -Path $iss -Value "AppPublisher=Perfect Solution"
          Add-Content  -Path $iss -Value "AppPublisherURL=https://github.com/vishnudixit2008/perfectsolution_flutter"
          Add-Content  -Path $iss -Value 'DefaultDirName={autopf}\Perfect Solution'
          Add-Content  -Path $iss -Value "DefaultGroupName=Perfect Solution"
          Add-Content  -Path $iss -Value 'UninstallDisplayIcon={app}\shop_management_flutter.exe'
          Add-Content  -Path $iss -Value "Compression=lzma2"
          Add-Content  -Path $iss -Value "SolidCompression=yes"
          Add-Content  -Path $iss -Value "OutputDir=."
          Add-Content  -Path $iss -Value "OutputBaseFilename=PerfectSolution-Setup"
          Add-Content  -Path $iss -Value "ArchitecturesInstallIn64BitMode=x64"
          Add-Content  -Path $iss -Value "MinVersion=10.0"
          Add-Content  -Path $iss -Value "PrivilegesRequired=admin"
          Add-Content  -Path $iss -Value ""

          # [Files] - app files + VC++ Redist bundled inside installer
          Add-Content  -Path $iss -Value "[Files]"
          Add-Content  -Path $iss -Value 'Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'
          Add-Content  -Path $iss -Value 'Source: "vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall'
          Add-Content  -Path $iss -Value ""

          # [Icons]
          Add-Content  -Path $iss -Value "[Icons]"
          Add-Content  -Path $iss -Value 'Name: "{autoprograms}\Perfect Solution"; Filename: "{app}\shop_management_flutter.exe"'
          Add-Content  -Path $iss -Value 'Name: "{autodesktop}\Perfect Solution"; Filename: "{app}\shop_management_flutter.exe"; Tasks: desktopicon'
          Add-Content  -Path $iss -Value ""

          # [Tasks]
          Add-Content  -Path $iss -Value "[Tasks]"
          Add-Content  -Path $iss -Value 'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"'
          Add-Content  -Path $iss -Value ""

          # [Run] - launch app after install
          Add-Content  -Path $iss -Value "[Run]"
          Add-Content  -Path $iss -Value 'Filename: "{app}\shop_management_flutter.exe"; Description: "{cm:LaunchProgram,Perfect Solution}"; Flags: nowait postinstall skipifsilent'
          Add-Content  -Path $iss -Value ""

          # [Code] - check prerequisites (VC++ Runtime) before installing app
          Add-Content  -Path $iss -Value "[Code]"
          Add-Content  -Path $iss -Value "function VCRedistX64Installed: Boolean;"
          Add-Content  -Path $iss -Value "var"
          Add-Content  -Path $iss -Value "  Installed: Cardinal;"
          Add-Content  -Path $iss -Value "begin"
          Add-Content  -Path $iss -Value "  // Check HKLM for VC++ 2015-2022 x64 runtime installed flag"
          Add-Content  -Path $iss -Value "  Result := RegQueryDWordValue(HKLM,"
          Add-Content  -Path $iss -Value "    'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64',"
          Add-Content  -Path $iss -Value "    'Installed', Installed) and (Installed = 1);"
          Add-Content  -Path $iss -Value "end;"
          Add-Content  -Path $iss -Value ""
          Add-Content  -Path $iss -Value "function PrepareToInstall(var NeedsRestart: Boolean): String;"
          Add-Content  -Path $iss -Value "var"
          Add-Content  -Path $iss -Value "  ResultCode: Integer;"
          Add-Content  -Path $iss -Value "begin"
          Add-Content  -Path $iss -Value "  Result := '';"
          Add-Content  -Path $iss -Value "  if not VCRedistX64Installed then begin"
          Add-Content  -Path $iss -Value "    WizardForm.StatusLabel.Caption := 'Installing Microsoft Visual C++ Runtime...';"
          Add-Content  -Path $iss -Value "    if not Exec(ExpandConstant('{tmp}\vc_redist.x64.exe'),"
          Add-Content  -Path $iss -Value "      '/install /quiet /norestart', '',"
          Add-Content  -Path $iss -Value "      SW_HIDE, ewWaitUntilTerminated, ResultCode) then begin"
          Add-Content  -Path $iss -Value "      Result := 'Failed to install Microsoft Visual C++ Runtime (code: ' + IntToStr(ResultCode) + '). Please install VC++ Redistributable 2015-2022 x64 manually, then retry.';"
          Add-Content  -Path $iss -Value "    end;"
          Add-Content  -Path $iss -Value "  end;"
          Add-Content  -Path $iss -Value "end;"

          Write-Host "=== Generated installer.iss ==="
          Get-Content $iss

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Package macOS DMG
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist_macos
          cp -R "build/macos/Build/Products/Release/Perfect Solution.app" dist_macos/ || cp -R build/macos/Build/Products/Release/*.app dist_macos/
          brew install create-dmg || true
          create-dmg \
            --volname "Perfect Solution" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Perfect Solution.app" 175 120 \
            --hide-extension "Perfect Solution.app" \
            --app-drop-link 425 120 \
            "PerfectSolution-macOS.dmg" \
            "dist_macos/" || hdiutil create -volname "Perfect Solution" -srcfolder "dist_macos/" -ov -format UDZO PerfectSolution-macOS.dmg

      - name: Upload Artifacts to GitHub Release
        if: matrix.target != 'web'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.target == 'android' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            ${{ matrix.target == 'windows' && 'PerfectSolution-Setup.exe' || '' }}
            ${{ matrix.target == 'macos' && 'PerfectSolution-macOS.dmg' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Web to GitHub Pages
        if: matrix.target == 'web'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
