name: Automated Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Windows Release Build (EXE Installer with bundled MSVC Runtime & Flutter Assets)
  # ─────────────────────────────────────────────────────────────────────────────
  release-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release --no-tree-shake-icons

      - name: Verify and Fix Release Folder Contents
        shell: powershell
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          $dataDir = "$releaseDir\data"
          $flutterAssetsDst = "$dataDir\flutter_assets"

          Write-Host "=== Verifying Release Folder ==="
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          # 1. Search & Bundle flutter_assets (fonts, icons, logos, AssetManifest)
          $possibleSources = @(
            'build\windows\runner\Release\data\flutter_assets',
            'build\windows\x64\runner\Release\data\flutter_assets',
            'build\windows\x64\flutter_assets',
            'build\windows\flutter_assets'
          )

          $foundSource = $null
          foreach ($src in $possibleSources) {
            if ((Test-Path $src) -and (Get-ChildItem $src).Count -gt 0) {
              $foundSource = $src
              break
            }
          }

          if ($foundSource) {
            Write-Host "Found valid flutter_assets at: $foundSource"
            if ($foundSource -ne $flutterAssetsDst) {
              Copy-Item -Recurse -Force "$foundSource\*" $flutterAssetsDst
              Write-Host "Copied all assets and fonts to $flutterAssetsDst"
            }
          } else {
            Write-Host "WARNING: Could not find flutter_assets source directory"
          }

          # 2. Ensure Material Icons font exists
          $fontFile = Get-ChildItem -Path $flutterAssetsDst -Recurse -Filter "*MaterialIcons*" -ErrorAction SilentlyContinue
          if ($fontFile) {
            Write-Host "OK: MaterialIcons font found: $($fontFile.FullName)"
          } else {
            Write-Host "WARNING: MaterialIcons font missing in $flutterAssetsDst!"
          }

          # 3. Ensure app.so (AOT library) is in data\
          $aotDst = "$dataDir\app.so"
          $aotAlt = 'build\windows\x64\app.so'
          if ((-not (Test-Path $aotDst)) -and (Test-Path $aotAlt)) {
            Copy-Item $aotAlt $aotDst -Force
            Write-Host "Copied app.so to data folder"
          }

          # 4. Copy MSVC C++ Runtime DLLs directly into release root folder
          Write-Host "=== Bundling MSVC C++ Runtime DLLs directly into Release folder ==="
          $vsRedistDir = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Filter "Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($vsRedistDir) {
            Write-Host "Found MSVC CRT directory at: $($vsRedistDir.FullName)"
            Copy-Item -Force "$($vsRedistDir.FullName)\*.dll" $releaseDir
            Write-Host "Successfully copied Visual Studio CRT DLLs to $releaseDir"
          } else {
            Write-Host "Fallback: Copying CRT DLLs from System32..."
            $crtDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "concrt140.dll")
            foreach ($dll in $crtDlls) {
              $sysDll = "C:\Windows\System32\$dll"
              if (Test-Path $sysDll) {
                Copy-Item $sysDll "$releaseDir\$dll" -Force
                Write-Host "Copied $dll from System32"
              }
            }
          }

          Write-Host "=== Final Release Directory Contents ==="
          Get-ChildItem $releaseDir | Select-Object Name


      - name: Package Windows Installer
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

          $iss = "installer.iss"

          Set-Content  -Path $iss -Encoding UTF8 -Value "[Setup]"
          Add-Content  -Path $iss -Value "AppName=Perfect Solution"
          Add-Content  -Path $iss -Value "AppVersion=1.2.3"
          Add-Content  -Path $iss -Value "AppPublisher=Perfect Solution"
          Add-Content  -Path $iss -Value "AppPublisherURL=https://github.com/vishnudixit2008/perfectsolution_flutter"
          Add-Content  -Path $iss -Value 'DefaultDirName={autopf}\Perfect Solution'
          Add-Content  -Path $iss -Value "DefaultGroupName=Perfect Solution"
          Add-Content  -Path $iss -Value 'UninstallDisplayIcon={app}\shop_management_flutter.exe'
          Add-Content  -Path $iss -Value "Compression=lzma2/normal"
          Add-Content  -Path $iss -Value "SolidCompression=yes"
          Add-Content  -Path $iss -Value "OutputDir=."
          Add-Content  -Path $iss -Value "OutputBaseFilename=PerfectSolution-Setup"
          Add-Content  -Path $iss -Value "ArchitecturesInstallIn64BitMode=x64"
          Add-Content  -Path $iss -Value "ArchitecturesAllowed=x64"
          Add-Content  -Path $iss -Value "MinVersion=10.0"
          Add-Content  -Path $iss -Value "PrivilegesRequired=lowest"
          Add-Content  -Path $iss -Value "PrivilegesRequiredOverridesAllowed=commandline"
          Add-Content  -Path $iss -Value "CloseApplications=yes"
          Add-Content  -Path $iss -Value "RestartApplications=no"
          Add-Content  -Path $iss -Value ""

          Add-Content  -Path $iss -Value "[Files]"
          Add-Content  -Path $iss -Value 'Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'
          Add-Content  -Path $iss -Value ""

          Add-Content  -Path $iss -Value "[Icons]"
          Add-Content  -Path $iss -Value 'Name: "{autoprograms}\Perfect Solution"; Filename: "{app}\shop_management_flutter.exe"'
          Add-Content  -Path $iss -Value 'Name: "{autodesktop}\Perfect Solution"; Filename: "{app}\shop_management_flutter.exe"; Tasks: desktopicon'
          Add-Content  -Path $iss -Value ""

          Add-Content  -Path $iss -Value "[Tasks]"
          Add-Content  -Path $iss -Value 'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"'
          Add-Content  -Path $iss -Value ""

          Add-Content  -Path $iss -Value "[Run]"
          Add-Content  -Path $iss -Value 'Filename: "{app}\shop_management_flutter.exe"; Description: "{cm:LaunchProgram,Perfect Solution}"; Flags: nowait postinstall skipifsilent'

          Write-Host "=== Generated installer.iss ==="
          Get-Content $iss

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Setup to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PerfectSolution-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Android Release Build (APK)
  # ─────────────────────────────────────────────────────────────────────────────
  release-android:
    name: Build & Release (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Release Build (DMG)
  # ─────────────────────────────────────────────────────────────────────────────
  release-macos:
    name: Build & Release (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Package macOS DMG
        run: |
          mkdir -p dist_macos
          cp -R "build/macos/Build/Products/Release/Perfect Solution.app" dist_macos/ || cp -R build/macos/Build/Products/Release/*.app dist_macos/
          brew install create-dmg || true
          create-dmg \
            --volname "Perfect Solution" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Perfect Solution.app" 175 120 \
            --hide-extension "Perfect Solution.app" \
            --app-drop-link 425 120 \
            "PerfectSolution-macOS.dmg" \
            "dist_macos/" || hdiutil create -volname "Perfect Solution" -srcfolder "dist_macos/" -ov -format UDZO PerfectSolution-macOS.dmg

      - name: Upload macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PerfectSolution-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Web Release Build (GitHub Pages)
  # ─────────────────────────────────────────────────────────────────────────────
  release-web:
    name: Build & Deploy (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
